<text x="880" y="122" font-size="15" fill="#1d2a36" text-anchor="start" font-weight="bold">How it works</text>
<text x="880" y="146" font-size="12" fill="#334" text-anchor="start" font-weight="normal">The app sends commands to the HM-10 over BLE. The Arduino turns</text>
<text x="880" y="164" font-size="12" fill="#334" text-anchor="start" font-weight="normal">each output pin HIGH for a short time. Each optocoupler 'presses'</text>
<text x="880" y="182" font-size="12" fill="#334" text-anchor="start" font-weight="normal">one meter button by closing its contacts, without a direct electrical</text>
<text x="880" y="200" font-size="12" fill="#334" text-anchor="start" font-weight="normal">connection to the meter's electronics.</text>
<text x="880" y="218" font-size="12" fill="#334" text-anchor="start" font-weight="normal">Pins held HIGH: WAKE 7 s, UP / OK / DOWN 200 ms (see push_button()).</text>
<text x="880" y="252" font-size="14" fill="#a04000" text-anchor="start" font-weight="bold">Assumptions to verify (not specified in the repo)</text>
<text x="880" y="274" font-size="11.5" fill="#5d4037" text-anchor="start" font-weight="normal">&#8226; Resistor values (1 k&#937; / 2 k&#937; divider and the LED resistors 'R')</text>
<text x="880" y="291" font-size="11.5" fill="#5d4037" text-anchor="start" font-weight="normal">  are typical; size them from your optocoupler and Arduino datasheets.</text>
<text x="880" y="308" font-size="11.5" fill="#5d4037" text-anchor="start" font-weight="normal">&#8226; Part numbers: the sketch names none.</text>
<text x="880" y="325" font-size="11.5" fill="#5d4037" text-anchor="start" font-weight="normal">&#8226; Where each optocoupler output attaches inside the meter depends on</text>
<text x="880" y="342" font-size="11.5" fill="#5d4037" text-anchor="start" font-weight="normal">  its PCB; check yours before soldering. 'COM' assumes a shared line.</text>
</svg>